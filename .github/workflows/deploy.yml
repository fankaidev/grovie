name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package version change
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(node -p "require('./package.json').version")"
          previous_version=""

          if git rev-parse HEAD^ >/dev/null 2>&1 && git show HEAD^:package.json >/tmp/previous-package.json 2>/dev/null; then
            previous_version="$(node -p "require('/tmp/previous-package.json').version")"
          fi

          if [ "$current_version" = "$previous_version" ]; then
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "Package version unchanged: $current_version"
          else
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "Package version changed: ${previous_version:-none} -> $current_version"
          fi

          echo "version=$current_version" >> "$GITHUB_OUTPUT"

      - name: Check existing npm version
        id: npm
        shell: bash
        run: |
          set -euo pipefail

          if npm view "@fankaidev/grovie@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@fankaidev/grovie@${{ steps.version.outputs.version }} is already published."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.version.outputs.version_changed == 'true' || steps.npm.outputs.exists != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        if: steps.version.outputs.version_changed == 'true' || steps.npm.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.version.outputs.version_changed == 'true' || steps.npm.outputs.exists != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run checks
        if: steps.version.outputs.version_changed == 'true' || steps.npm.outputs.exists != 'true'
        run: pnpm check

      - name: Publish to npm
        if: steps.npm.outputs.exists != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check existing GitHub release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="v${{ steps.version.outputs.version }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "GitHub release $tag already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.release.outputs.exists != 'true' && (steps.version.outputs.version_changed == 'true' || steps.npm.outputs.exists != 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          tag="v$version"

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes
