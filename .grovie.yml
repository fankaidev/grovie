# Grovie configuration.
# GitHub remains the source of truth; this file defines local runner policy.
version: 1

queue:
  label: grovie

branches:
  prefix: grovie/

pullRequests:
  create: true
  draft: false

comments:
  mode: concise

safety:
  # This must stay false. Grovie should never push directly to the default branch.
  allowDefaultBranchPush: false
